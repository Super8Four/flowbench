services:
  app:
    build: .
    image: iperf-workspace:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
      - "${IPERF_BIND_ADDRESS:-127.0.0.1}:${IPERF_PORT:-5201}:5201/tcp"
      - "${IPERF_BIND_ADDRESS:-127.0.0.1}:${IPERF_PORT:-5201}:5201/udp"
    environment:
      RUNS_DIRECTORY: /data/runs
    volumes:
      - iperf_data:/data
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  iperf_data:
