version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      workflow-actions:
        patterns: ['*']
