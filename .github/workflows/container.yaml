name: Ubuntu container

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Ubuntu container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read application version
        run: |
          version=$(python3 -c "import re, runpy; value=runpy.run_path('app/version.py')['__version__']; assert isinstance(value, str) and re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', value), 'Use a valid application version'; print(value)")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Version tag must exactly match app/version.py: expected v$version" >&2
            exit 1
          fi
          echo "FLOWBENCH_VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate Compose and build Ubuntu image
        run: |
          docker compose config --quiet
          docker build --build-arg FLOWBENCH_VERSION="${{ env.FLOWBENCH_VERSION }}" --build-arg VCS_REF="${{ github.sha }}" --tag iperf-workspace:local .
          test "$(docker image inspect iperf-workspace:local --format '{{.Architecture}}')" = "${{ matrix.arch }}"
          docker run --rm --entrypoint tracepath iperf-workspace:local -V
      - name: Run all tests with Linux iPerf3
        run: >-
          docker run --rm --entrypoint python
          --mount type=bind,source="${{ github.workspace }}/tests",target=/tests,readonly
          --mount type=bind,source="${{ github.workspace }}/scripts",target=/scripts,readonly
          iperf-workspace:local -m unittest discover -s /tests -v
      - name: Test container lifecycle and persistent evidence
        id: lifecycle
        run: python3 scripts/check-container.py
      - name: Test actual optional Flent RRUL with an isolated loopback peer
        run: |
          docker build --file scripts/Flent.Dockerfile --tag flowbench-flent-test .
          docker run --rm --init --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint /opt/venv/bin/python \
            --mount type=bind,source="${{ github.workspace }}/scripts/check-flent.py",target=/checks/check-flent.py,readonly \
            flowbench-flent-test /checks/check-flent.py
      - name: Render PDF and Word report fixtures
        id: reports
        if: ${{ !cancelled() && steps.lifecycle.outcome == 'success' }}
        run: |
          mkdir -p report-qa
          chmod 777 report-qa
          docker run --rm --network none --entrypoint python \
            --mount type=bind,source="${{ github.workspace }}/scripts/check-reports.py",target=/checks/check-reports.py,readonly \
            --mount type=bind,source="${{ github.workspace }}/report-qa",target=/qa \
            iperf-workspace:local /checks/check-reports.py --output-dir /qa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
          mkdir -p report-qa/docx-pdf report-qa/rendered
          libreoffice -env:UserInstallation=file:///tmp/flowbench-report-qa-profile --headless \
            --convert-to pdf --outdir report-qa/docx-pdf report-qa/*.docx
          test "$(find report-qa/docx-pdf -name '*.pdf' | wc -l)" -eq 3
          python3 scripts/check-report-layout.py --docx-dir report-qa --pdf-dir report-qa/docx-pdf
          for source in report-qa/*.pdf report-qa/docx-pdf/*.pdf; do
            name=$(basename "$source" .pdf)
            folder=$(basename "$(dirname "$source")")
            pdfinfo "$source"
            pdftoppm -r 110 -png "$source" "report-qa/rendered/${folder}-${name}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.reports.outcome == 'success' }}
        with:
          name: report-qa-${{ matrix.arch }}
          path: report-qa/
          retention-days: 14
      - name: Package verified image
        if: github.event_name != 'pull_request'
        run: |
          arch="${{ matrix.arch }}"
          prefix="flowbench-${FLOWBENCH_VERSION}-linux-${arch}"
          docker save iperf-workspace:local | gzip > "${prefix}.tar.gz"
          docker image inspect iperf-workspace:local > "${prefix}.image.json"
          sha256sum "${prefix}.tar.gz" "${prefix}.image.json" > "${prefix}.SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: flowbench-linux-${{ matrix.arch }}
          path: flowbench-${{ env.FLOWBENCH_VERSION }}-linux-${{ matrix.arch }}.*
          retention-days: 14
          compression-level: 0
      - name: Write exact-source job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ci-artifacts
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {name.lower(): os.environ[name] for name in ('JOB_STATUS', 'SOURCE_SHA', 'ARCH', 'EVENT_NAME', 'RUN_ID')}
          data['note'] = 'Summary presence is not a passing CI result. Verify all exact-source job and step conclusions.'
          Path('ci-artifacts/container-summary.json').write_text(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Native container result\n\n' + '\n'.join(f'- {key}: `{value}`' for key, value in data.items()) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-container-summary-${{ matrix.arch }}
          path: ci-artifacts/container-summary.json
          retention-days: 14
          if-no-files-found: warn
